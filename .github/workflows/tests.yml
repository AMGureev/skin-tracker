name: Legacy Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  legacy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-legacy.txt
      - name: Install Dependencies
        run: python -m pip install -r requirements-legacy.txt
      - name: Run Legacy Tests
        run: python -m unittest discover -s tests -p "test_legacy*.py" -v
      - name: Run Isolated GUI Smoke Test
        run: python skin_tracker.py --smoke-test --diagnostics-output legacy-smoke-ci.json
